<div class="container py-4 mb-5">
    <div class="card max-w-4xl mx-auto border-0 shadow-sm rounded-4">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0 px-4 px-md-5">
            <div class="d-flex align-items-center gap-3 mb-2">
                <button class="btn btn-sm btn-light text-muted rounded-circle" style="width: 36px; height: 36px;" routerLink="/dashboard" title="Go Back">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <h4 class="mb-0 fw-bold text-dark">{{ isEditMode ? 'Update Product' : 'Add New Product' }}</h4>
            </div>
            <p class="text-muted small ms-5 ps-1 mb-0">Fill in the details to track price drops across platforms.</p>
        </div>
        <div class="card-body p-4 p-md-5 pt-4">
            <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
                
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold text-uppercase tracking-wide">Product Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg bg-light border-0 shadow-none" formControlName="productName" placeholder="e.g. iPhone 15 Pro Max">
                        <div class="text-danger small mt-2 d-flex align-items-center gap-1" *ngIf="productForm.get('productName')?.touched && productForm.get('productName')?.invalid">
                            <i class="bi bi-exclamation-circle"></i> Product Name is required
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold text-uppercase tracking-wide">Category <span class="text-danger">*</span></label>
                        <select class="form-select form-select-lg bg-light border-0 shadow-none" formControlName="category">
                            <option value="">Select Category</option>
                            <option value="Mobile">Mobile</option>
                            <option value="Electronic">Electronic</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Others">Others</option>
                        </select>
                        <div class="text-danger small mt-2 d-flex align-items-center gap-1" *ngIf="productForm.get('category')?.touched && productForm.get('category')?.invalid">
                            <i class="bi bi-exclamation-circle"></i> Category is required
                        </div>
                    </div>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold text-uppercase tracking-wide">Target Price (₹) <span class="text-danger">*</span></label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-0 text-muted">₹</span>
                            <input type="number" class="form-control bg-light border-0 shadow-none ps-2" formControlName="targetPrice" placeholder="0.00">
                        </div>
                        <div class="text-danger small mt-2 d-flex align-items-center gap-1" *ngIf="productForm.get('targetPrice')?.touched && productForm.get('targetPrice')?.invalid">
                            <i class="bi bi-exclamation-circle"></i> Valid Target Price is required
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold text-uppercase tracking-wide">Movement Type <span class="text-danger">*</span></label>
                        <select class="form-select form-select-lg bg-light border-0 shadow-none" formControlName="movementType">
                            <option value="Fast Move">Fast Move (High Volatility)</option>
                            <option value="Average Move">Average Move</option>
                            <option value="Slow Movement">Slow Movement (Stable)</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h5 class="fw-bold mb-0 text-dark">Tracking Links</h5>
                    <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-3">{{ links.length }} Link{{ links.length !== 1 ? 's' : '' }}</span>
                </div>
                
                <div formArrayName="links">
                    <div class="card border border-light bg-light bg-opacity-50 mb-3 rounded-4" *ngFor="let link of links.controls; let i=index" [formGroupName]="i" style="transition: all 0.2s; animation: fadeIn 0.3s ease-out;">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="mb-0 fw-semibold text-muted d-flex align-items-center gap-2">
                                    <span class="bg-white rounded-circle d-flex justify-content-center align-items-center shadow-sm" style="width: 24px; height: 24px; font-size: 0.75rem;">{{ i+1 }}</span>
                                    Store Link
                                </h6>
                                <button type="button" class="btn btn-sm btn-white text-danger border-0 rounded-circle" style="width: 32px; height: 32px;" (click)="removeLink(i)" *ngIf="links.length > 1" title="Remove Link">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label text-muted small fw-semibold">Website</label>
                                    <select class="form-select border-0 shadow-sm" formControlName="websiteName">
                                        <option value="">Auto-detect</option>
                                        <option value="Flipkart">Flipkart</option>
                                        <option value="Amazon">Amazon</option>
                                        <option value="Reliance Digital">Reliance Digital</option>
                                        <option value="Myntra">Myntra</option>
                                        <option value="Big basket">Big basket</option>
                                        <option value="Swiggy Instamart">Swiggy Instamart</option>
                                        <option value="Croma">Croma</option>
                                        <option value="Vijay sales">Vijay sales</option>
                                        <option value="Jio mart">Jio mart</option>
                                        <option value="Tata new">Tata new</option>
                                    </select>
                                </div>
                                <div class="col-md-8">
                                    <label class="form-label text-muted small fw-semibold">Product URL <span class="text-danger">*</span></label>
                                    <div class="input-group shadow-sm rounded-2 overflow-hidden">
                                        <span class="input-group-text bg-white border-0 text-muted"><i class="bi bi-link-45deg"></i></span>
                                        <input type="text" class="form-control border-0 ps-0 shadow-none" formControlName="productUrl" placeholder="https://...">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mb-5 text-center mt-4">
                    <button type="button" class="btn btn-light text-primary fw-semibold rounded-pill px-4 border-primary border-opacity-25" (click)="addLink()">
                        <i class="bi bi-plus-lg me-1"></i> Add Another Source
                    </button>
                </div>

                <div class="d-flex justify-content-end gap-3 border-top pt-4 mt-4">
                    <button type="button" class="btn btn-light px-4 rounded-pill fw-semibold" routerLink="/dashboard">Cancel</button>
                    <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm" [disabled]="isSubmitting">
                        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                        {{ isEditMode ? 'Save Changes' : 'Start Tracking' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
